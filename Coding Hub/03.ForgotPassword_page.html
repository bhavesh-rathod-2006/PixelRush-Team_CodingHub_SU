<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>
    <link rel="stylesheet" href="./03.ForgotPassword_style.css">
</head>
<body>
    <div class="card">
        <!-- Title and description extracted from Forgot Password Page.pdf -->
        <h2>Forgot Password?</h2>
        <p class="description">Enter your registered email address and we’ll send you a link to reset your password.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">EMAIL ADDRESS *</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
                <span class="helper-text">Must match the email associated with your account.</span>
            </div>
            
            <button type="submit" class="btn-submit">SEND RESET LINK</button>
        </form>
        <a href="#" class="back-link">BACK TO LOGIN</a>
    </div>
</body>
</html>
